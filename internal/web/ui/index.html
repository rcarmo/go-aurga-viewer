<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURGA · LAN viewer</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div><h1>AURGA <span>LAN viewer</span></h1><p id="device">Discovering device…</p></div><div id="connection" role="status">Disconnected</div></header>
<main><form id="login"><label>Device passcode <input id="passcode" type="password" maxlength="16" autocomplete="off" required></label><button id="connect" type="submit">Connect</button><button id="disconnect" type="button" disabled>Disconnect</button></form>
<div class="tools"><label><input id="control" type="checkbox" disabled> Enable keyboard &amp; mouse</label><button id="refresh" disabled>Refresh video</button><button id="cad" disabled>Ctrl + Alt + Del</button><button id="fullscreen">Fullscreen</button><span id="metrics"></span></div>
<div id="screen" tabindex="0" aria-label="Remote computer screen. Enable control and click here to use keyboard and mouse."><canvas id="canvas" width="1280" height="720"></canvas><div id="placeholder">Connect to view the HDMI signal</div></div><p id="message" role="status">Read-only by default. Keyboard and mouse stay local until you enable control.</p><p class="note">Direct LAN connection · no cloud account · experimental protocol implementation</p></main></body></html>

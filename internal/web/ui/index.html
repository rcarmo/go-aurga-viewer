<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AURGA</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<main id="screen" tabindex="0" aria-label="Remote computer"><canvas id="canvas" width="1280" height="720"></canvas><div id="placeholder" role="status">Connecting…</div></main>
<button id="keyboard" type="button" aria-label="Open keyboard" title="Keyboard"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M5 9h2m2 0h2m2 0h2m2 0h2M5 12h2m2 0h2m2 0h2m2 0h2M7 15h10"/></svg></button>
<textarea id="mobile-input" aria-label="Remote keyboard" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<dialog id="gate"><form id="login"><label id="passcode-label" for="passcode">Device passcode</label><input id="passcode" type="password" maxlength="16" autocomplete="current-password" required autofocus><p id="message" role="status"></p><button id="connect" type="submit">Connect</button></form></dialog>
</body></html>
